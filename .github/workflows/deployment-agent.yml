name: Deployment Agent (CI/CD)

on:
  push:
    branches:
      - main
    paths:
      - 'packages/admin/**'
      - 'packages/front/**'
      - 'packages/shared/**'
      - '.github/workflows/deployment-agent.yml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/admin/**'
      - 'packages/front/**'
      - 'packages/shared/**'
  workflow_dispatch:
    inputs:
      deploy_front:
        description: 'Deploy Frontend?'
        type: boolean
        default: true
      deploy_admin:
        description: 'Deploy Admin?'
        type: boolean
        default: true

permissions:
  contents: 'write'
  id-token: 'write'


jobs:
  validate:
    name: Validate and Build Dry-Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        # version comes from package.json "packageManager" (pnpm 11): a pin here breaks the action
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check prompt copies (skipped when the brain is not present)
        run: pnpm check-prompts

      - name: Typecheck (front + admin)
        run: pnpm typecheck

      - name: Lint Admin
        run: pnpm --filter admin lint

      - name: Lint Frontend
        run: pnpm --filter front lint

      - name: Build Dry-Run
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

  check_changes:
    name: Check what to deploy
    runs-on: ubuntu-latest
    outputs:
      deploy_front: ${{ steps.filter.outputs.front == 'true' || github.event.inputs.deploy_front == 'true' || github.event_name == 'push' && (steps.filter.outputs.shared == 'true' || steps.filter.outputs.root == 'true') }}
      deploy_admin: ${{ steps.filter.outputs.admin == 'true' || github.event.inputs.deploy_admin == 'true' || github.event_name == 'push' && (steps.filter.outputs.shared == 'true' || steps.filter.outputs.root == 'true') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            front:
              - 'packages/front/**'
            admin:
              - 'packages/admin/**'
            shared:
              - 'packages/shared/**'
            root:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/deployment-agent.yml'

  deploy:
    name: Build, Push and Deploy
    needs: [validate, check_changes]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: front
            target: frontend
            enabled: ${{ needs.check_changes.outputs.deploy_front }}
          - package: admin
            target: admin
            enabled: ${{ needs.check_changes.outputs.deploy_admin }}
    steps:
      - name: Checkout code
        if: ${{ matrix.enabled == 'true' }}
        uses: actions/checkout@v5

      - name: Install pnpm
        if: ${{ matrix.enabled == 'true' }}
        # version comes from package.json "packageManager" (pnpm 11): a pin here breaks the action
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: ${{ matrix.enabled == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        if: ${{ matrix.enabled == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build Package
        if: ${{ matrix.enabled == 'true' }}
        run: pnpm --filter ${{ matrix.package }} build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      # Auth SENZA CHIAVI (Workload Identity Federation), non piu' FIREBASE_TOKEN.
      #
      # Perche' non il token: quello di `firebase login:ci` e' un refresh token OAuth legato
      # alla PERSONA (admin@thaiakhakitchen.com) e allo stesso client di firebase-tools. Un
      # nuovo login, un logout o una revoca di Google lo uccidono: il 19/08 ha funzionato alle
      # 08:33 e alle 10:02, ed era gia' invalido alle 10:57. Non e' scadenza, e' revoca.
      #
      # Perche' non una chiave JSON del service account: l'org policy
      # constraints/iam.disableServiceAccountKeyCreation le VIETA, giustamente (una chiave
      # non scade mai: se esce, esce per sempre).
      #
      # Come funziona: GitHub firma un token OIDC per QUESTO repo, Google lo scambia con un
      # access token che vive un'ora. Niente da rubare, niente da rinnovare.
      # Setup lato Google (2026-08-25): pool `github` + provider `github-thaiakha` (issuer
      # token.actions.githubusercontent.com, ristretto a repository_owner == 'ThaiAkha'),
      # SA github-hosting-deploy con firebasehosting.admin + firebase.viewer, e il principalSet
      # del repo con roles/iam.workloadIdentityUser sul SA.
      # Richiede `id-token: write` (gia' concesso a livello di workflow, riga 34).
      - name: Authenticate to Google Cloud
        if: ${{ matrix.enabled == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: 'projects/213862741976/locations/global/workloadIdentityPools/github/providers/github-thaiakha'
          service_account: 'github-hosting-deploy@thai-akha-app-2026.iam.gserviceaccount.com'

      - name: Deploy to Firebase Hosting
        if: ${{ matrix.enabled == 'true' }}
        run: |
          npx --yes firebase-tools deploy --only hosting:${{ matrix.target }} --project ${{ secrets.GCP_PROJECT_ID }} --non-interactive
