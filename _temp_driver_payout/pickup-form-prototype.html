<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modulo Richiesta Pickup - Thai Akha Kitchen</title>
<style>
  :root{
    --brand:#f02539;        /* rosso Thai Akha */
    --brand-dark:#c41d2e;
    --green:#98C93C;
    --ink:#1f2328;
    --muted:#6b7280;
    --line:#e5e7eb;
    --bg:#f4f5f7;
    --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; padding:24px 16px;
    display:flex; justify-content:center; align-items:flex-start; min-height:100vh;
  }
  .card{
    width:100%; max-width:480px; background:var(--card);
    border:1px solid var(--line); border-radius:14px;
    box-shadow:0 6px 24px rgba(0,0,0,.06); padding:24px;
  }
  h1{
    font-size:20px; margin:0 0 4px; color:var(--brand); line-height:1.25;
  }
  .sub{ font-size:13px; color:var(--muted); margin:0 0 20px; }
  label{ display:block; font-size:13px; font-weight:600; margin:16px 0 6px; }
  .req::after{ content:" *"; color:var(--brand); }
  input,select,textarea{
    width:100%; padding:11px 12px; font-size:15px; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:9px; font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{
    outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(240,37,57,.12);
  }
  textarea{ resize:vertical; min-height:72px; }
  .radios{ display:flex; gap:10px; }
  .radio{
    flex:1; position:relative; border:1px solid var(--line); border-radius:9px;
    padding:11px 12px; text-align:center; font-size:14px; font-weight:600; cursor:pointer; user-select:none;
  }
  .radio input{ position:absolute; opacity:0; inset:0; cursor:pointer; }
  .radio.checked{ border-color:var(--brand); background:rgba(240,37,57,.06); color:var(--brand); }
  .price{
    margin-top:18px; background:var(--ink); color:#fff; border-radius:11px;
    padding:16px 18px; display:flex; align-items:center; justify-content:space-between;
  }
  .price .lbl{ font-size:13px; opacity:.8; }
  .price .val{ font-size:26px; font-weight:700; }
  .price .val small{ font-size:14px; font-weight:500; opacity:.8; }
  button{
    margin-top:22px; width:100%; padding:14px; font-size:16px; font-weight:700; color:#fff;
    background:var(--brand); border:none; border-radius:10px; cursor:pointer; transition:background .15s;
  }
  button:hover{ background:var(--brand-dark); }
  .hint{ font-size:12px; color:var(--muted); margin-top:6px; }
  .badge{
    display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:#8a6d00; background:#fff4cc; border:1px solid #ffe69a; border-radius:999px; padding:3px 9px; margin-bottom:14px;
  }
</style>
</head>
<body>
  <form class="card" id="pickupForm" novalidate>
    <div class="badge">Modulo temporaneo · bypass booking</div>
    <h1>Modulo Richiesta Pickup<br>Thai Akha Kitchen</h1>
    <p class="sub">Inserisci i dati del servizio per generare il payout.</p>

    <!-- 1. Data -->
    <label for="date" class="req">Data</label>
    <input type="date" id="date" name="date" required />

    <!-- 2. Nome driver -->
    <label for="driver" class="req">Nome driver</label>
    <select id="driver" name="driver" required>
      <option value="" disabled selected>Seleziona driver…</option>
      <option value="b7866c46-221d-4b16-9fd8-72722d173de5">Driver 01</option>
      <option value="b85dffbe-a935-40ae-99cc-ed453a757f37">Driver 02</option>
      <option value="5810f384-5390-49f1-8277-035487b11cb5">Thai Akha</option>
    </select>

    <!-- 3. Tipo classe -->
    <label class="req">Tipo classe</label>
    <div class="radios" id="sessionRadios">
      <label class="radio checked">
        <input type="radio" name="session" value="morning_class" checked />
        Morning Class
      </label>
      <label class="radio">
        <input type="radio" name="session" value="evening_class" />
        Evening Class
      </label>
    </div>

    <!-- 4. Numero hotel (stop) -->
    <label for="stops" class="req">Numero hotel (stop)</label>
    <select id="stops" name="stops" required>
      <option value="1-2" data-stops="2">1-2 hotel</option>
      <option value="3-4" data-stops="4">3-4 hotel</option>
      <option value="5-6" data-stops="6">5-6 hotel</option>
      <option value="7plus" data-stops="7">7+ hotel</option>
    </select>

    <!-- 5. Prezzo (auto) -->
    <div class="price">
      <span class="lbl">Prezzo payout</span>
      <span class="val"><span id="priceVal">450</span> <small>Baht</small></span>
    </div>

    <!-- 6. Numero clienti totali -->
    <label for="pax" class="req">Numero clienti totali (persone in auto)</label>
    <input type="number" id="pax" name="pax" min="1" max="12" value="1" required />
    <p class="hint">Min 1 · Max 12 persone.</p>

    <!-- 7. Commenti -->
    <label for="comments">Commenti</label>
    <textarea id="comments" name="comments" placeholder="Note opzionali sul servizio…"></textarea>

    <!-- 8. Send -->
    <button type="submit">Send</button>
  </form>

<script>
  // --- Tabella tariffe (stessa di driver_payout_tiers nel DB) ---
  const PRICING = {
    morning_class: { "1-2":450, "3-4":550, "5-6":650, "7plus":750 },
    evening_class: { "1-2":400, "3-4":500, "5-6":600, "7plus":700 }
  };

  const form     = document.getElementById('pickupForm');
  const stopsEl  = document.getElementById('stops');
  const priceEl  = document.getElementById('priceVal');
  const radios   = document.querySelectorAll('input[name="session"]');

  function currentSession(){
    return document.querySelector('input[name="session"]:checked').value;
  }
  function updatePrice(){
    const price = PRICING[currentSession()][stopsEl.value];
    priceEl.textContent = price;
    return price;
  }
  // stile pulsanti radio + ricalcolo prezzo
  document.getElementById('sessionRadios').addEventListener('change', () => {
    document.querySelectorAll('.radio').forEach(r =>
      r.classList.toggle('checked', r.querySelector('input').checked));
    updatePrice();
  });
  stopsEl.addEventListener('change', updatePrice);

  // default: data di oggi
  document.getElementById('date').valueAsDate = new Date();

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if(!form.reportValidity()) return;

    const driverSel = document.getElementById('driver');
    const stopSel   = stopsEl.options[stopsEl.selectedIndex];

    const summary = {
      data:            document.getElementById('date').value,
      driver_id:       driverSel.value,
      driver_nome:     driverSel.options[driverSel.selectedIndex].text,
      tipo_classe:     currentSession(),
      numero_hotel:    stopsEl.value,                       // codice range (es. "3-4")
      stop_rappresentativi: Number(stopSel.dataset.stops),  // per la RPC reale
      prezzo_baht:     updatePrice(),
      clienti_totali:  Number(document.getElementById('pax').value),
      commenti:        document.getElementById('comments').value.trim()
    };

    console.log('Riepilogo Pickup:', summary);
    alert(
      'Riepilogo Richiesta Pickup\n' +
      '———————————————\n' +
      'Data: ' + summary.data + '\n' +
      'Driver: ' + summary.driver_nome + '\n' +
      'Classe: ' + (summary.tipo_classe === 'morning_class' ? 'Morning' : 'Evening') + '\n' +
      'Hotel (stop): ' + summary.numero_hotel + '\n' +
      'Prezzo: ' + summary.prezzo_baht + ' Baht\n' +
      'Clienti totali: ' + summary.clienti_totali + '\n' +
      'Commenti: ' + (summary.commenti || '—')
    );
  });

  updatePrice();
</script>
</body>
</html>
