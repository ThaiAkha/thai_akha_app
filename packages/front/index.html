    <!-- Icone: gli assi sono FISSATI a quelli che il codice usa davvero (opsz 24,
         GRAD 0, peso 400-700, riempimento 0-1). Chiedendoli tutti a range pieno
         Google serviva un font variabile da 5.360.396 byte, sette volte l'intero
         JavaScript dell'app; cosi' ne serve 1.451.140, stessi glifi. `display=block`
         resta: vedi il commento in styles/index.css sul perche' lo swap qui rovina
         il disegno. Misurato il 2026-09-05. -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..700,0..1,0&display=block"
        rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..700,0..1,0&display=block"
            rel="stylesheet" />
    </noscript>
